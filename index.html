<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kruschtelhundehoehle</title>
  <meta name="description" content="Persönliche Kruschtelhundehoehle mit Pinnwand, Journal und mehreren echten Bildern.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#efe6e1;--bg2:#e6dad3;--surface:#fbf6f2;--surface2:#f3ebe6;--surface3:#eaded8;--paper:#fff8f3;--text:#2f2123;--muted:#736266;--faint:#a28d93;--line:rgba(47,33,35,.10);--line2:rgba(47,33,35,.18);--rose:#c86b83;--rose2:#dd8ea4;--berry:#80384a;--moss:#7c996c;--gold:#c39b64;--shadow1:0 2px 6px rgba(48,24,31,.06);--shadow2:0 18px 42px rgba(48,24,31,.12)}
    [data-theme="dark"]{--bg:#120d10;--bg2:#1b1417;--surface:#231a1e;--surface2:#2d2328;--surface3:#372a31;--paper:#33272d;--text:#f6ebe8;--muted:#ccb7bc;--faint:#917d83;--line:rgba(246,235,232,.10);--line2:rgba(246,235,232,.16);--rose:#d86f89;--rose2:#ba566e;--berry:#7a3344;--moss:#879d78;--gold:#c19a66;--shadow1:0 4px 10px rgba(0,0,0,.18);--shadow2:0 20px 48px rgba(0,0,0,.34)}
    :root{--r1:12px;--r2:18px;--r3:24px;--r4:30px;--xs:clamp(.75rem,.72rem + .2vw,.875rem);--sm:clamp(.875rem,.82rem + .2vw,1rem);--base:clamp(1rem,.96rem + .2vw,1.125rem);--lg:clamp(1.125rem,1rem + .45vw,1.45rem);--xl:clamp(1.7rem,1.2rem + 1.2vw,2.5rem);--title:clamp(1.3rem,1.08rem + 1vw,1.9rem);--body:"Nunito",system-ui,sans-serif;--display:"Baloo 2","Nunito",system-ui,sans-serif;--hand:"Patrick Hand",cursive;--max:580px;--nav:88px}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%} html{color-scheme:dark light} body{font-family:var(--body);font-size:var(--base);line-height:1.5;color:var(--text);background:radial-gradient(circle at top left,rgba(216,111,137,.08),transparent 20%),radial-gradient(circle at 90% 10%,rgba(124,153,108,.08),transparent 22%),linear-gradient(180deg,var(--bg2),var(--bg))} body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.06) 0 3px,transparent 4px),radial-gradient(circle at 70% 35%,rgba(255,255,255,.04) 0 4px,transparent 5px),radial-gradient(circle at 40% 75%,rgba(0,0,0,.16) 0 5px,transparent 6px),radial-gradient(circle at 82% 80%,rgba(255,255,255,.04) 0 4px,transparent 5px);background-size:180px 180px,220px 220px,260px 260px,240px 240px;mix-blend-mode:soft-light}.app{max-width:var(--max);min-height:100dvh;margin:0 auto;padding:14px 14px calc(var(--nav) + 22px + env(safe-area-inset-bottom,0px))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.kicker{margin:0 0 6px;font-size:var(--xs);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}.sub{margin:2px 0 0;color:var(--muted);font-size:var(--sm)}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-family:var(--display);font-size:var(--xl);line-height:.92}.mark{width:38px;height:38px;color:var(--rose)}.toggle,.chip,.tag,.navnote{min-height:42px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);box-shadow:var(--shadow1)} button{font:inherit;color:inherit;background:none;border:none;cursor:pointer} img{display:block;max-width:100%;height:auto}.main,.stack{display:grid;gap:16px}.hero,.paper,.soft,.photo,.board,.journal,.memory,.avatar-card{position:relative;overflow:hidden;border:1px solid var(--line)}.hero{border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow2);padding:16px}.hero-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:12px;align-items:stretch}.avatar-card{border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface2);box-shadow:var(--shadow1);padding:10px;display:grid;gap:10px}.avatar-frame{aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid rgba(246,235,232,.10);background:var(--surface3)}.avatar-frame img{width:100%;height:100%;object-fit:cover;object-position:center top}.avatar-card .note{margin:0}.hero-panel{display:flex;flex-direction:column;justify-content:space-between;border-radius:24px;padding:16px;background:linear-gradient(180deg,rgba(216,111,137,.08),transparent 32%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface2);box-shadow:var(--shadow1)}.label{margin:0 0 6px;font-size:var(--xs);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}.hero-title,.screen-title{margin:0;font-family:var(--display);line-height:.95}.hero-title{font-size:clamp(1.85rem,1.3rem + 1vw,2.45rem);max-width:10ch}.screen-title{font-size:var(--xl)}.copy,.muted{color:var(--muted)}.note{margin:10px 0 0;color:var(--rose);font-family:var(--hand);font-size:1.12rem}.row,.tagrow{display:flex;gap:10px;flex-wrap:wrap}.row{margin-top:14px}.btn{min-height:44px;padding:12px 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface3);font-weight:800;box-shadow:var(--shadow1)}.btn-primary{background:linear-gradient(180deg,var(--rose),var(--rose2));color:#250e15;border-color:transparent}.btn-moss{background:linear-gradient(180deg,#8ea685,var(--moss));color:#152014;border-color:transparent}.shelf{display:grid;gap:12px;padding:12px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.008)),var(--bg2);border:1px solid var(--line)}.head{display:flex;justify-content:space-between;align-items:end;gap:10px}.head p{margin:0}.photo-rail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{border-radius:22px;background:var(--surface);box-shadow:var(--shadow2)}.photo img{width:100%;aspect-ratio:4/5;object-fit:cover}.caption{padding:12px 14px}.caption strong{display:block;font-size:var(--sm)}.caption span{display:block;color:var(--muted);font-size:var(--sm);margin-top:4px}.board-layout{display:grid;grid-template-columns:1.12fr .88fr;gap:12px}.board{padding:14px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow2)}.pincol{display:grid;gap:10px}.sticky{padding:14px;border-radius:18px;box-shadow:var(--shadow1);border:1px dashed rgba(255,255,255,.18)}.sticky h4{margin:0 0 8px;font-size:var(--sm)}.sticky ul{margin:0;padding-left:18px}.sticky li{margin:0 0 6px}.sticky-pink{background:rgba(216,111,137,.16)}.sticky-green{background:rgba(124,153,108,.18)}.sticky-gold{background:rgba(193,154,102,.18)}.soft{padding:14px;border-radius:20px;background:var(--surface2);box-shadow:var(--shadow1)}.journal{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)),var(--paper);box-shadow:var(--shadow2)}.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0;padding-top:0}.answer{margin-top:8px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-family:var(--hand);font-size:1.05rem;color:var(--text)}.timeline{display:grid;gap:12px}.memory{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow2)}.memory-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.preview{overflow:hidden;border-radius:18px;border:1px solid rgba(246,235,232,.08);margin-bottom:12px;background:var(--surface2)}.preview img{width:100%;aspect-ratio:4/3;object-fit:cover}.nav{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;max-width:calc(var(--max) - 20px);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012)),color-mix(in srgb,var(--surface) 92%,black 8%);border:1px solid var(--line2);box-shadow:var(--shadow2)}.navbtn{min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;color:var(--faint)}.navbtn.active{color:var(--text);background:rgba(216,111,137,.12);box-shadow:inset 0 0 0 1px rgba(216,111,137,.2)}.navlabel{font-size:var(--xs);font-weight:800}@media (max-width:520px){.hero-grid,.photo-rail,.board-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="kicker">Kruschtelhundehöhle</p>
        <div class="brand">
          <svg class="mark" viewBox="0 0 72 72" aria-label="Kruschtelhundehöhle Logo" role="img">
            <path d="M13 47c2-15 12-26 25-26 7 0 12 2 16 7 2-8 8-13 15-13" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M21 47h28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="28" cy="30" r="2.5" fill="currentColor"/>
          </svg>
          <div>
            <h1>Höhlenjournal</h1>
            <p class="sub">mehr du, mehr hunde, mehr echte momente</p>
          </div>
        </div>
      </div>
      <button class="toggle" data-theme-toggle aria-label="Zu hellem Modus wechseln">☾</button>
    </header>

    <main id="app" class="main"></main>

    <nav class="nav" aria-label="Hauptnavigation">
      <button class="navbtn active" data-route="home"><span>⌂</span><span class="navlabel">Home</span></button>
      <button class="navbtn" data-route="board"><span>⌘</span><span class="navlabel">Board</span></button>
      <button class="navbtn" data-route="journal"><span>✎</span><span class="navlabel">Journal</span></button>
      <button class="navbtn" data-route="moments"><span>♡</span><span class="navlabel">Momente</span></button>
      <button class="navbtn" data-route="dogs"><span>🐾</span><span class="navlabel">Rudel</span></button>
    </nav>
  </div>

  <script>
    const data={
      hero:{title:'Willkommen zurück, kleine Heldin',text:'Nicht als Fantasy-Poster, sondern als persönliche Figur im Mittelpunkt: mit echten Bildern, warmer Pinnwand und einem Abendjournal.',note:'mehr menü-gefühl, weniger riesen-illustration'},
      board:{events:['Mi 19:00 Gassi-Runde','Do 10:00 Termin','So Fotozeit im Grünen'],todos:['2 Nachrichten beantworten','Futter prüfen','Lieblingsmoment speichern'],shopping:['Hafermilch','Obst','Hundesnacks'],ideas:['Sticker für Pfotenkarten','Herbst-Date planen','Mini-Album mit euch bauen']},
      journal:[{q:'Was war heute schön?',a:'Ein kleiner echter Moment, der warm geblieben ist.'},{q:'Was braucht morgen Aufmerksamkeit?',a:'Nur eine Sache freundlich anfangen.'},{q:'Was möchte ich festhalten?',a:'Ein Bild, ein Satz oder eine Beobachtung.'}],
      homePhotos:[
        {img:'./IMG-20260826-WA0007.jpg',title:'Euer Rudel',text:'Das Gruppenbild wirkt wie eine Startkarte für die ganze Höhle.'},
        {img:'./IMG-20260903-WA0010.jpg',title:'Ruhe im Haus',text:'Der Hundekorb und das Licht geben dem Look echte Gemütlichkeit.'}
      ],
      moments:[
        {type:'Nähe',time:'Heute',title:'Dein Charakter als Leitfigur',copy:'Das Menü beginnt mit dir als zentraler Figur und nicht mit einem fremden Fantasy-Motiv.',img:'./IMG-20260904-WA0003.jpg'},
        {type:'Rudel',time:'Immer',title:'Die Höhle gehört euch allen',copy:'Das Gruppenfoto macht aus der Seite ein gemeinsames Archiv statt einer abstrakten App.',img:'./IMG-20260826-WA0007.jpg'},
        {type:'Natur',time:'Draußen',title:'Kleine Abenteuer bleiben leicht',copy:'Der kleine Hund im Grünen bringt das Abenteuergefühl auf eine echte, persönliche Ebene.',img:'./snapseed__1788538710416.jpg'}
      ],
      dogs:[
        {img:'./IMG-20260903-WA0010.jpg',title:'Hauswache',text:'Innen warm, weich und ruhig.'},
        {img:'./snapseed__1788538710416.jpg',title:'Kleiner Entdecker',text:'Draußen neugierig und lebendig.'},
        {img:'./IMG-20260826-WA0006.jpg',title:'Kuschelmoment',text:'Rudel, Decke, Sonne und Nähe.'}
      ]
    };
    const state={route:'home'};const app=document.getElementById('app');const nav=[...document.querySelectorAll('.navbtn')];const toggle=document.querySelector('[data-theme-toggle]');let theme='dark';toggle?.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);toggle.textContent=theme==='dark'?'☾':'☀'});
    function bind(){app.querySelectorAll('[data-route-jump]').forEach(el=>el.addEventListener('click',()=>{state.route=el.dataset.routeJump;render();window.scrollTo({top:0,behavior:'smooth'})}))}
    function home(){return `<section class="stack"><article class="hero"><div class="hero-grid"><div class="avatar-card"><div class="avatar-frame"><img src="./IMG-20260904-WA0003.jpg" alt="Porträt als stilisierte Hauptfigur" width="843" height="1499" loading="eager"></div><p class="note">kleine heldin der höhle</p></div><div class="hero-panel"><div><p class="label">Begrüßung</p><h2 class="hero-title">${data.hero.title}</h2><p class="copy">${data.hero.text}</p><p class="note">${data.hero.note}</p></div><div class="row"><button class="btn btn-primary" data-route-jump="board">Zur Pinnwand</button><button class="btn btn-moss" data-route-jump="journal">3 Fragen</button></div></div></div></article><section class="shelf"><div class="head"><div><p class="label">Bildiger Einstieg</p><p class="sub">Nicht ein Motiv, sondern mehrere echte Fenster.</p></div></div><div class="photo-rail">${data.homePhotos.map(item=>`<article class="photo"><img src="${item.img}" alt="Persönliches Foto in der Startansicht" width="804" height="1428" loading="lazy"><div class="caption"><strong>${item.title}</strong><span>${item.text}</span></div></article>`).join('')}</div></section></section>`}
    function board(){return `<section class="stack"><header><p class="label">Sammelwand</p><h2 class="screen-title">Pinnwand</h2><p class="muted">Hier dürfen Termine, Listen, Ideen und kleine Sticker wohnen.</p></header><section class="shelf"><div class="board-layout"><article class="board"><h3>Heute anpinnen</h3><div class="rule"></div><div class="pincol"><section class="sticky sticky-pink"><h4>Termine</h4><ul>${data.board.events.map(i=>`<li>${i}</li>`).join('')}</ul></section><section class="sticky sticky-green"><h4>Todos</h4><ul>${data.board.todos.map(i=>`<li>${i}</li>`).join('')}</ul></section></div></article><div class="pincol"><section class="sticky sticky-gold"><h4>Einkauf</h4><ul>${data.board.shopping.map(i=>`<li>${i}</li>`).join('')}</ul></section><section class="sticky sticky-pink"><h4>Ideen</h4><ul>${data.board.ideas.map(i=>`<li>${i}</li>`).join('')}</ul></section><article class="soft"><p class="label">Sticker</p><h3>pfote · herz · stern</h3><p class="copy">Kleine Marker geben der Pinnwand später noch mehr Charakter.</p></article></div></div></section></section>`}
    function journal(){return `<section class="stack"><header><p class="label">Tagesjournal</p><h2 class="screen-title">3 Fragen am Abend</h2><p class="muted">Ein ruhiger, kleiner Abschluss statt einer kalten Eingabemaske.</p></header><article class="journal"><h3>Heute kurz einsammeln</h3><div class="rule"></div>${data.journal.map(item=>`<section class="q"><strong>${item.q}</strong><div class="answer">${item.a}</div></section>`).join('')}<div class="row"><button class="btn btn-primary">Antworten speichern</button><button class="btn" data-route-jump="moments">Als Moment sehen</button></div></article></section>`}
    function moments(){return `<section class="stack"><header><p class="label">Momente</p><h2 class="screen-title">Persönliche Karten</h2><p class="muted">Mehr Tagebuchseite, weniger App-Modul.</p></header><div class="timeline">${data.moments.map(item=>`<article class="memory"><div class="memory-top"><span class="chip">${item.type}</span><span class="muted">${item.time}</span></div><div class="preview"><img src="${item.img}" alt="Persönlicher Moment in Kartenform" width="804" height="1428" loading="lazy"></div><h3>${item.title}</h3><p class="copy">${item.copy}</p></article>`).join('')}</div></section>`}
    function dogs(){return `<section class="stack"><header><p class="label">Rudel</p><h2 class="screen-title">Pfotenbereich</h2><p class="muted">Die Hunde bekommen ihren eigenen weichen Platz in der Höhle.</p></header><section class="shelf"><div class="photo-rail">${data.dogs.map(item=>`<article class="photo"><img src="${item.img}" alt="Hundemoment im Rudelbereich" width="804" height="1428" loading="lazy"><div class="caption"><strong>${item.title}</strong><span>${item.text}</span></div></article>`).join('')}</div></section></section>`}
    function render(){const views={home:home(),board:board(),journal:journal(),moments:moments(),dogs:dogs()};app.innerHTML=views[state.route]||views.home;nav.forEach(n=>{const active=n.dataset.route===state.route;n.classList.toggle('active',active)});bind()}
    nav.forEach(n=>n.addEventListener('click',()=>{state.route=n.dataset.route;render();window.scrollTo({top:0,behavior:'smooth'})}));render();
  </script>
</body>
</html>
