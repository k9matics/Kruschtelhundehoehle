<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kruschtelhundehoehle</title>
  <meta name="description" content="Klickbare Single-File-App für Kruschtelhundehoehle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#efe8e0;--bg-2:#e6ddd4;--surface:#faf5ef;--surface-2:#f2ebe3;--surface-3:#eadfd4;--card-paper:#f6ecdf;--text:#2c241e;--text-muted:#6f6258;--text-faint:#97887d;--line:rgba(44,36,30,.10);--line-strong:rgba(44,36,30,.18);--love:#bc6b8d;--love-2:#d990ad;--moss:#668158;--brick:#93585a;--brass:#a98d62;--shadow-a:0 2px 4px rgba(36,24,20,.05);--shadow-b:0 16px 34px rgba(36,24,20,.10)}
    [data-theme="dark"]{--bg:#161311;--bg-2:#1d1916;--surface:#221d1a;--surface-2:#2b2521;--surface-3:#342d28;--card-paper:#3a312b;--text:#f2e9df;--text-muted:#c7b7a8;--text-faint:#8b7e73;--line:rgba(245,236,226,.10);--line-strong:rgba(245,236,226,.17);--love:#d787a7;--love-2:#bf6f90;--moss:#7f9a74;--brick:#a26568;--brass:#b89a68;--shadow-a:0 3px 8px rgba(0,0,0,.18);--shadow-b:0 18px 42px rgba(0,0,0,.28)}
    :root{--radius-sm:12px;--radius-md:18px;--radius-lg:24px;--radius-xl:30px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--text-xs:clamp(.75rem,.72rem + .2vw,.875rem);--text-sm:clamp(.875rem,.82rem + .2vw,1rem);--text-base:clamp(1rem,.96rem + .2vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .45vw,1.45rem);--text-xl:clamp(1.65rem,1.2rem + 1vw,2.3rem);--text-title:clamp(1.3rem,1.1rem + 1vw,1.9rem);--font-body:"Nunito",system-ui,sans-serif;--font-display:"Baloo 2","Nunito",system-ui,sans-serif;--font-hand:"Patrick Hand",cursive;--max-width:540px;--nav-height:86px}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%} html{color-scheme:dark light} body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.5;color:var(--text);background:radial-gradient(circle at top left,rgba(255,255,255,.03),transparent 22%),linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 100%)} button{font:inherit;color:inherit;background:none;border:none;cursor:pointer} a{color:inherit}.skip-link{position:absolute;left:-999px;top:0}.skip-link:focus{left:16px;top:16px;z-index:999;background:var(--surface);padding:12px 14px;border-radius:12px}.app-shell{max-width:var(--max-width);min-height:100dvh;margin:0 auto;padding:14px 14px calc(var(--nav-height) + 18px + env(safe-area-inset-bottom,0px))}.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.micro-label{margin:0 0 6px;font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}.sub-brand{margin:2px 0 0;color:var(--text-muted);font-size:var(--text-sm)}.brand-row{display:flex;align-items:center;gap:12px}.brand-row h1{margin:0;font-family:var(--font-display);font-size:var(--text-xl);line-height:.92}.brand-mark{width:38px;height:38px;color:var(--love)}.theme-toggle,.chip,.filter-chip,.tab-pill{min-height:42px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);box-shadow:var(--shadow-a)}.app-main,.screen-stack{display:grid;gap:16px}.screen-stack{content-visibility:auto}.shelf{display:grid;gap:12px;padding:12px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.008)),var(--bg-2);border:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px}.section-label{margin:0 0 6px;font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}.section-note{margin:0;color:var(--text-muted);font-size:var(--text-sm)}.hero-card,.stone-card,.paper-card,.slim-card{position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-b)}.hero-card{min-height:260px;padding:18px;border-radius:30px;background:radial-gradient(circle at 12% 14%,rgba(255,255,255,.06),transparent 20%),radial-gradient(circle at 92% 0%,rgba(215,135,167,.15),transparent 20%),linear-gradient(145deg,#312925 0%,#241f1c 56%,#191614 100%)}.hero-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 28%);pointer-events:none}.hero-body{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:auto}.hero-title{margin:0 0 10px;font-family:var(--font-display);font-size:clamp(1.65rem,1.2rem + 1.8vw,2.3rem);line-height:.96;max-width:11ch}.card-copy{margin:0;color:var(--text-muted)}.hand-note{margin:10px 0 0;color:var(--love);font-family:var(--font-hand);font-size:1.05rem}.button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{min-height:44px;padding:12px 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface-3);font-weight:800;box-shadow:var(--shadow-a)}.btn-primary{background:linear-gradient(180deg,var(--love),var(--love-2));color:#231514;border-color:transparent}.btn-moss{background:linear-gradient(180deg,#8ca883,var(--moss));color:#162012;border-color:transparent}.tab-rail{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tab-pill{white-space:nowrap;color:var(--text-muted)}.tab-pill.is-active{background:rgba(215,135,167,.12);border-color:rgba(215,135,167,.24);color:var(--text)}.paper-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.paper-card{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)),var(--card-paper);color:color-mix(in srgb,var(--text) 92%,black 8%)}.paper-card h3,.stone-card h3,.slim-card h3{margin:0;font-family:var(--font-display);font-size:var(--text-title);line-height:1}.paper-rule{height:1px;background:var(--line);margin:10px 0 12px}.tag-row{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:var(--text-xs);font-weight:800}.stone-card{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface)}.slim-card{padding:14px;border-radius:20px;background:var(--surface-2);box-shadow:var(--shadow-a)}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat-label{margin:0;color:var(--text-faint);font-size:var(--text-sm)}.stat-value{margin:8px 0 0;font-size:var(--text-lg);font-weight:800;line-height:1.15}.action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.action-card{min-height:88px;padding:12px 10px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--surface-2);display:grid;place-items:center;text-align:center;gap:8px;box-shadow:var(--shadow-a)}.action-card__icon{width:36px;height:36px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05)}.action-card--love .action-card__icon{background:rgba(215,135,167,.16);color:var(--love)}.action-card--moss .action-card__icon{background:rgba(127,154,116,.18);color:var(--moss)}.action-card__label{font-size:var(--text-xs);font-weight:800}.activity-list{display:grid;gap:10px}.activity-row{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center}.activity-dot{width:10px;height:10px;border-radius:999px;background:var(--love);box-shadow:0 0 0 5px rgba(215,135,167,.10)}.activity-dot--moss{background:var(--moss);box-shadow:0 0 0 5px rgba(127,154,116,.10)}.activity-meta strong{display:block;font-size:var(--text-sm)}.activity-meta span{font-size:var(--text-sm);color:var(--text-muted)}.time-chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:var(--text-xs);color:var(--text-muted)}.catalog-list{display:grid;gap:12px}.catalog-card{padding:16px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow-b)}.catalog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.catalog-preview{min-height:112px;border-radius:18px;background:linear-gradient(135deg,#40362f,#2a2420);border:1px solid rgba(245,236,226,.07);margin-bottom:12px}.catalog-preview--story{background:radial-gradient(circle at top left,rgba(215,135,167,.15),transparent 26%),linear-gradient(135deg,#3a2b31,#261f1c)}.catalog-preview--lab{background:radial-gradient(circle at top left,rgba(127,154,116,.14),transparent 26%),linear-gradient(135deg,#30362d,#21231e)}.folder-stack{display:grid;gap:10px}.folder-card{padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface-2);border:1px solid var(--line);box-shadow:var(--shadow-a)}.folder-card code{display:block;font-size:var(--text-sm)}.folder-card span{display:block;color:var(--text-muted);font-size:var(--text-sm);margin-top:3px}.bottom-nav{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;max-width:calc(var(--max-width) - 20px);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012)),color-mix(in srgb,var(--surface) 92%,black 8%);border:1px solid var(--line-strong);box-shadow:var(--shadow-b)}.bottom-nav__item{min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;color:var(--text-faint)}.bottom-nav__item.is-active{color:var(--text);background:rgba(215,135,167,.10);box-shadow:inset 0 0 0 1px rgba(215,135,167,.18)}.bottom-nav__label{font-size:var(--text-xs);font-weight:800}.screen-title{margin:0;font-family:var(--font-display);font-size:var(--text-xl);line-height:.95}.muted{color:var(--text-muted)}@media (max-width:430px){.paper-grid{grid-template-columns:1fr}.action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-block">
        <p class="micro-label">Kruschtelhundehöhle</p>
        <div class="brand-row">
          <svg class="brand-mark" viewBox="0 0 72 72" aria-label="Kruschtelhundehöhle Logo" role="img">
            <path d="M13 47c2-15 12-26 25-26 7 0 12 2 16 7 2-8 8-13 15-13" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M21 47h28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="28" cy="30" r="2.5" fill="currentColor"/>
          </svg>
          <div>
            <h1>Höhlenarchiv</h1>
            <p class="sub-brand">private Karten, Momente, Pfotenzeug</p>
          </div>
        </div>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Zu hellem Modus wechseln">☾</button>
    </header>

    <main id="app" class="app-main"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="bottom-nav__item is-active" data-route="home" aria-current="page"><span class="bottom-nav__icon">⌂</span><span class="bottom-nav__label">Home</span></button>
      <button class="bottom-nav__item" data-route="timeline"><span class="bottom-nav__icon">⌘</span><span class="bottom-nav__label">Kartei</span></button>
      <button class="bottom-nav__item" data-route="chat"><span class="bottom-nav__icon">✉</span><span class="bottom-nav__label">Post</span></button>
      <button class="bottom-nav__item" data-route="dog"><span class="bottom-nav__icon">🐾</span><span class="bottom-nav__label">Pfote</span></button>
      <button class="bottom-nav__item" data-route="create"><span class="bottom-nav__icon">＋</span><span class="bottom-nav__label">Werkbank</span></button>
    </nav>
  </div>

  <script>
    const data={hero:{eyebrow:'Heute im Archiv',title:'Ein wärmerer, schönerer Eingang in deine Höhle',text:'Mehr Kartei, mehr Materialgefühl und weniger Demo-App. Alles soll privater, ruhiger und echter wirken.',note:'nicht perfekt, aber schon liebevoller'},digest:{title:'21:30 Abendbrief',status:'3 kleine Dinge möchten noch gesehen werden.'},stats:[{title:'Letzte Nachricht',value:'„Ich denk an dich“'},{title:'Nächster Termin',value:'Morgen 10:00'},{title:'Hund heute',value:'Ruhig · 2x Gassi'},{title:'Lab',value:'Normal · 18:42'}],actions:[{label:'Text',icon:'✎',tone:''},{label:'Foto',icon:'◫',tone:''},{label:'Story',icon:'✦',tone:'love'},{label:'Pfote',icon:'🐾',tone:'moss'}],activity:[{title:'Foto mit Spike',time:'vor 2 Std.',tone:'moss'},{title:'Abendnotiz abgelegt',time:'heute 20:14',tone:'love'},{title:'Story-Mappe vorbereitet',time:'bereit',tone:'love'}],timeline:[{type:'Story',time:'Heute · von dir',title:'Halloween-Abend mit Spike',copy:'Eine warme Karte mit Platz für Bild, Text und kleine Reaktionen.',preview:'story'},{type:'Lab',time:'Heute 18:42',title:'HARNELYZER-Messung',copy:'Grün bleibt hier nur für Gesundheit und ruhige Statussignale.',preview:'lab'},{type:'Moment',time:'Gestern',title:'Spaziergang im Abendlicht',copy:'Momente wirken eher wie Karteikarten als wie SaaS-Widgets.',preview:'default'}],files:[{path:'index.html',note:'Eine einzige Datei für Handy-Upload und GitHub Pages.'},{path:'<style>',note:'Enthält das komplette V2-Designsystem direkt im Dokument.'},{path:'<script>',note:'Enthält alle Inhalte und die klickbare Navigation.'}]};
    const state={route:'home'};
    const app=document.getElementById('app');
    const navItems=[...document.querySelectorAll('.bottom-nav__item')];
    const themeToggle=document.querySelector('[data-theme-toggle]');
    let theme='dark';
    themeToggle?.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);themeToggle.textContent=theme==='dark'?'☾':'☀'});
    function jumpWires(){app.querySelectorAll('[data-route-jump]').forEach(el=>el.addEventListener('click',()=>{state.route=el.dataset.routeJump;render();window.scrollTo({top:0,behavior:'smooth'})}))}
    function sectionHead(label,note,right=''){return `<div class="section-head"><div><p class="section-label">${label}</p><p class="section-note">${note}</p></div>${right}</div>`}
    function home(){return `<section class="screen-stack"><article class="hero-card"><div class="hero-body"><div class="hero-top"><p class="section-label">${data.hero.eyebrow}</p><span class="chip">Basalt Warm</span></div><div><h2 class="hero-title">${data.hero.title}</h2><p class="card-copy">${data.hero.text}</p><p class="hand-note">${data.hero.note}</p><div class="button-row"><button class="btn btn-primary" data-route-jump="timeline">Ins Archiv</button><button class="btn" data-route-jump="files">Ordner zeigen</button></div></div></div></article><section class="shelf"><article class="paper-grid"><div class="paper-card"><p class="section-label">Abendbrief</p><h3>${data.digest.title}</h3><div class="paper-rule"></div><p>${data.digest.status}</p><div class="button-row"><button class="btn btn-primary" data-route-jump="timeline">Jetzt öffnen</button><button class="btn">Später</button></div></div><div class="stone-card"><p class="section-label">Ton</p><h3>Cozy Stone</h3><p class="card-copy">Weniger Dashboard, mehr Kartei, Papier, Register und ruhige Höhlenmaterialien.</p><div class="tag-row"><span class="tag">warm</span><span class="tag">privat</span><span class="tag">ordentlich</span></div></div></article></section><section class="shelf">${sectionHead('Schnellüberblick','Vier Dinge auf einen Blick.','<span class="time-chip">Heute</span>')}<div class="stats-grid">${data.stats.map(s=>`<article class="slim-card"><p class="stat-label">${s.title}</p><p class="stat-value">${s.value}</p></article>`).join('')}</div></section><section class="shelf">${sectionHead('Werkbank','Wichtige Dinge direkt anfassen.')}<div class="action-grid">${data.actions.map(a=>`<button class="action-card action-card--${a.tone}" data-route-jump="create"><span class="action-card__icon">${a.icon}</span><span class="action-card__label">${a.label}</span></button>`).join('')}</div></section><section class="shelf">${sectionHead('Gerade passiert','Weniger Boxen, mehr kleine Kartei-Zeilen.')}<div class="activity-list">${data.activity.map(a=>`<article class="slim-card activity-row"><span class="activity-dot ${a.tone==='moss'?'activity-dot--moss':''}"></span><div class="activity-meta"><strong>${a.title}</strong><span>${a.time}</span></div><span class="time-chip">sehen</span></article>`).join('')}</div></section></section>`}
    function timeline(){return `<section class="screen-stack"><header><p class="section-label">Kartei</p><h2 class="screen-title">Höhlenregister</h2><p class="muted">Jeder Eintrag bleibt eine klare Karte mit nur einer Hauptidee.</p></header><div class="tab-rail"><button class="tab-pill is-active">Alle</button><button class="tab-pill">Wir</button><button class="tab-pill">Hund</button><button class="tab-pill">Lab</button><button class="tab-pill">Fotos</button></div><div class="catalog-list">${data.timeline.map(item=>`<article class="catalog-card"><div class="catalog-top"><span class="chip">${item.type}</span><span class="muted">${item.time}</span></div><div class="catalog-preview ${item.preview==='story'?'catalog-preview--story':item.preview==='lab'?'catalog-preview--lab':''}"></div><h3>${item.title}</h3><p class="card-copy">${item.copy}</p><div class="button-row"><button class="btn" data-route-jump="chat">Teilen</button><button class="btn btn-primary">Öffnen</button></div></article>`).join('')}</div></section>`}
    function placeholder(label,title,text,route){return `<section class="screen-stack"><header><p class="section-label">${label}</p><h2 class="screen-title">${title}</h2><p class="muted">${text}</p></header><article class="paper-card"><h3>${title} als eigener Bereich</h3><div class="paper-rule"></div><p>${text}</p><div class="button-row"><button class="btn btn-primary" data-route-jump="${route}">Weiter</button><button class="btn" data-route-jump="files">Struktur sehen</button></div></article></section>`}
    function files(){return `<section class="screen-stack"><header><p class="section-label">Ordnerkartei</p><h2 class="screen-title">Was schon gebaut ist</h2><p class="muted">Hier ist die Single-File-Struktur für den Handy-Upload.</p></header><section class="shelf folder-stack">${data.files.map(f=>`<article class="folder-card"><code>${f.path}</code><span>${f.note}</span></article>`).join('')}</section></section>`}
    function render(){const views={home:home(),timeline:timeline(),chat:placeholder('Postfach','Post','Nachrichten, Teilen und kleine Liebesdetails bekommen hier später ihre eigene Oberfläche.','timeline'),dog:placeholder('Pfotenbereich','Pfote','Hier kommen Routinen, Wohlbefinden, Fotos und der Weg ins Lab hinein.','timeline'),create:placeholder('Werkbank','Werkbank','Hier starten Text, Foto, Story, Sticker und später kleine Bastelansichten.','files'),files:files()};app.innerHTML=views[state.route]||views.home;navItems.forEach(item=>{const active=item.dataset.route===state.route;item.classList.toggle('is-active',active);if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current')});jumpWires()}
    navItems.forEach(item=>item.addEventListener('click',()=>{state.route=item.dataset.route;render();window.scrollTo({top:0,behavior:'smooth'})}));
    render();
  </script>
</body>
</html>
