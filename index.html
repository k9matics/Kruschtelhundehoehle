<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kruschtelhundehoehle</title>
  <meta name="description" content="Persönlichere, bildstärkere Version der Kruschtelhundehoehle-App.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#f0e8e3;--bg-2:#e7ddd7;--surface:#faf5f1;--surface-2:#f1e9e4;--surface-3:#e8dcd6;--card-paper:#f8eeea;--text:#2a1f1f;--text-muted:#6f5f60;--text-faint:#a28e91;--line:rgba(42,31,31,.10);--line-strong:rgba(42,31,31,.16);--rose:#b86473;--rose-2:#d17e8f;--berry:#7b3546;--moss:#708769;--silver:#cfc9cd;--shadow-a:0 2px 5px rgba(44,20,28,.06);--shadow-b:0 18px 42px rgba(44,20,28,.12)}
    [data-theme="dark"]{--bg:#140f12;--bg-2:#1b1518;--surface:#231b1f;--surface-2:#2c2328;--surface-3:#372a31;--card-paper:#3a2b31;--text:#f4e8e5;--text-muted:#ccb7bb;--text-faint:#8c767d;--line:rgba(244,232,229,.10);--line-strong:rgba(244,232,229,.16);--rose:#d36d83;--rose-2:#b65268;--berry:#7f3342;--moss:#83997a;--silver:#d4cdd2;--shadow-a:0 3px 8px rgba(0,0,0,.18);--shadow-b:0 18px 46px rgba(0,0,0,.34)}
    :root{--radius-sm:12px;--radius-md:18px;--radius-lg:24px;--radius-xl:30px;--text-xs:clamp(.75rem,.72rem + .2vw,.875rem);--text-sm:clamp(.875rem,.82rem + .2vw,1rem);--text-base:clamp(1rem,.96rem + .2vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .45vw,1.45rem);--text-xl:clamp(1.7rem,1.2rem + 1.2vw,2.5rem);--text-title:clamp(1.3rem,1.08rem + 1vw,1.9rem);--font-body:"Nunito",system-ui,sans-serif;--font-display:"Baloo 2","Nunito",system-ui,sans-serif;--font-hand:"Patrick Hand",cursive;--max-width:560px;--nav-height:86px}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%} html{color-scheme:dark light} body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.5;color:var(--text);background:radial-gradient(circle at top left,rgba(211,109,131,.08),transparent 24%),linear-gradient(180deg,var(--bg-2),var(--bg))} button{font:inherit;color:inherit;background:none;border:none;cursor:pointer} img{display:block;max-width:100%;height:auto} .app-shell{max-width:var(--max-width);min-height:100dvh;margin:0 auto;padding:14px 14px calc(var(--nav-height) + 18px + env(safe-area-inset-bottom,0px))}.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.micro-label{margin:0 0 6px;font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}.sub-brand{margin:2px 0 0;color:var(--text-muted);font-size:var(--text-sm)}.brand-row{display:flex;align-items:center;gap:12px}.brand-row h1{margin:0;font-family:var(--font-display);font-size:var(--text-xl);line-height:.92}.brand-mark{width:38px;height:38px;color:var(--rose)}.theme-toggle,.chip,.tab-pill{min-height:42px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);box-shadow:var(--shadow-a)}.app-main,.screen-stack{display:grid;gap:16px}.hero-card,.paper-card,.stone-card,.slim-card,.photo-card,.memory-card{position:relative;overflow:hidden;border:1px solid var(--line)}.hero-card{border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow-b)}.hero-image-wrap{position:relative;aspect-ratio:4/5;overflow:hidden}.hero-image{width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(1.02) contrast(1.02)}.hero-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,18,.02) 0%,rgba(20,15,18,.06) 30%,rgba(20,15,18,.74) 100%)}.hero-body{position:absolute;left:0;right:0;bottom:0;padding:18px;z-index:2}.section-label{margin:0 0 6px;font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}.hero-title,.screen-title{margin:0;font-family:var(--font-display);line-height:.95}.hero-title{font-size:clamp(1.8rem,1.3rem + 1.2vw,2.4rem);max-width:11ch}.screen-title{font-size:var(--text-xl)}.card-copy,.muted{color:var(--text-muted)}.hand-note{margin:10px 0 0;color:var(--rose);font-family:var(--font-hand);font-size:1.08rem}.button-row,.tag-row,.tab-rail{display:flex;gap:10px;flex-wrap:wrap}.button-row{margin-top:14px}.btn{min-height:44px;padding:12px 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface-3);font-weight:800;box-shadow:var(--shadow-a)}.btn-primary{background:linear-gradient(180deg,var(--rose),var(--rose-2));color:#250e15;border-color:transparent}.btn-moss{background:linear-gradient(180deg,#8fa585,var(--moss));color:#152014;border-color:transparent}.shelf{display:grid;gap:12px;padding:12px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.008)),var(--bg-2);border:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px}.section-note{margin:0;color:var(--text-muted);font-size:var(--text-sm)}.paper-grid{display:grid;grid-template-columns:1fr;gap:12px}.paper-card{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)),var(--card-paper);box-shadow:var(--shadow-a)}.paper-card h3,.stone-card h3,.slim-card h3,.memory-card h3{margin:0;font-family:var(--font-display);font-size:var(--text-title);line-height:1}.paper-rule{height:1px;background:var(--line);margin:10px 0 12px}.tag{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:var(--text-xs);font-weight:800}.memory-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo-card{border-radius:22px;background:var(--surface);box-shadow:var(--shadow-b)}.photo-card img{width:100%;aspect-ratio:4/5;object-fit:cover}.photo-caption{padding:12px 14px}.photo-caption strong{display:block;font-size:var(--text-sm)}.photo-caption span{display:block;color:var(--text-muted);font-size:var(--text-sm);margin-top:4px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slim-card{padding:14px;border-radius:20px;background:var(--surface-2);box-shadow:var(--shadow-a)}.stat-label{margin:0;color:var(--text-faint);font-size:var(--text-sm)}.stat-value{margin:8px 0 0;font-size:var(--text-lg);font-weight:800;line-height:1.15}.catalog-list{display:grid;gap:12px}.memory-card{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--surface);box-shadow:var(--shadow-b)}.memory-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.memory-preview{overflow:hidden;border-radius:18px;border:1px solid rgba(244,232,229,.08);margin-bottom:12px;background:var(--surface-2)}.memory-preview img{width:100%;aspect-ratio:4/3;object-fit:cover}.bottom-nav{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;max-width:calc(var(--max-width) - 20px);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012)),color-mix(in srgb,var(--surface) 92%,black 8%);border:1px solid var(--line-strong);box-shadow:var(--shadow-b)}.bottom-nav__item{min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;color:var(--text-faint)}.bottom-nav__item.is-active{color:var(--text);background:rgba(211,109,131,.12);box-shadow:inset 0 0 0 1px rgba(211,109,131,.2)}.bottom-nav__label{font-size:var(--text-xs);font-weight:800}@media (max-width:430px){.memory-strip{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-block">
        <p class="micro-label">Kruschtelhundehöhle</p>
        <div class="brand-row">
          <svg class="brand-mark" viewBox="0 0 72 72" aria-label="Kruschtelhundehöhle Logo" role="img">
            <path d="M13 47c2-15 12-26 25-26 7 0 12 2 16 7 2-8 8-13 15-13" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M21 47h28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="28" cy="30" r="2.5" fill="currentColor"/>
          </svg>
          <div>
            <h1>Herzensarchiv</h1>
            <p class="sub-brand">näher, persönlicher, bildiger</p>
          </div>
        </div>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Zu hellem Modus wechseln">☾</button>
    </header>

    <main id="app" class="app-main"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="bottom-nav__item is-active" data-route="home" aria-current="page"><span>⌂</span><span class="bottom-nav__label">Home</span></button>
      <button class="bottom-nav__item" data-route="timeline"><span>⌘</span><span class="bottom-nav__label">Kartei</span></button>
      <button class="bottom-nav__item" data-route="post"><span>✉</span><span class="bottom-nav__label">Post</span></button>
      <button class="bottom-nav__item" data-route="dog"><span>🐾</span><span class="bottom-nav__label">Pfote</span></button>
      <button class="bottom-nav__item" data-route="more"><span>＋</span><span class="bottom-nav__label">Mehr</span></button>
    </nav>
  </div>

  <script>
    const data={hero:{eyebrow:'Portrait des Tages',title:'Mehr von dir. Weniger Demo.',text:'Diese Version nimmt dein Bild als echte Stimmungsvorlage: weiches Licht, dunkle Kontraste, Rosenholz und etwas Metallglanz.',note:'fühlt sich schon eher nach dir an'},strip:[{title:'Direkter Moment',text:'Nah, offen, freundlich.',img:'./IMG-20260906-WA0003.jpg'},{title:'Farbstimmung',text:'Rosé, Off-White, Schwarz, Silber.',img:'./IMG-20260906-WA0003.jpg'}],stats:[{title:'Ton',value:'intim · weich'},{title:'Akzent',value:'Rosenholz'},{title:'Material',value:'Papier · Satin'},{title:'Gefühl',value:'näher dran'}],timeline:[{type:'Portrait',time:'Heute',title:'Selbstbild als Designanker',copy:'Das Bild gibt der App jetzt Persönlichkeit statt nur Stimmungstext.',img:'./IMG-20260906-WA0003.jpg'},{type:'Detail',time:'Jetzt',title:'Metall, Rot und dunkles Haar',copy:'Silberne Akzente und Bordeaux-Töne werden zu kleinen UI-Hinweisen.',img:'./IMG-20260906-WA0003.jpg'},{type:'Erinnerung',time:'Später',title:'Mehr Bilder können hier als echte Karten wohnen',copy:'Mit weiteren Fotos wird daraus ein richtiges gemeinsames Archiv.',img:'./IMG-20260906-WA0003.jpg'}]};
    const state={route:'home'};const app=document.getElementById('app');const nav=[...document.querySelectorAll('.bottom-nav__item')];const themeToggle=document.querySelector('[data-theme-toggle]');let theme='dark';themeToggle?.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);themeToggle.textContent=theme==='dark'?'☾':'☀'});
    function bind(){app.querySelectorAll('[data-route-jump]').forEach(el=>el.addEventListener('click',()=>{state.route=el.dataset.routeJump;render();window.scrollTo({top:0,behavior:'smooth'})}))}
    function home(){return `<section class="screen-stack"><article class="hero-card"><div class="hero-image-wrap"><img class="hero-image" src="./IMG-20260906-WA0003.jpg" alt="Portrait als persönlicher Designanker" width="804" height="1428" loading="eager"></div><div class="hero-body"><p class="section-label">${data.hero.eyebrow}</p><h2 class="hero-title">${data.hero.title}</h2><p class="card-copy">${data.hero.text}</p><p class="hand-note">${data.hero.note}</p><div class="button-row"><button class="btn btn-primary" data-route-jump="timeline">Bildkarten öffnen</button><button class="btn" data-route-jump="post">Postfach</button></div></div></article><section class="shelf"><div class="section-head"><div><p class="section-label">Ableitung</p><p class="section-note">Aus dem Foto in Oberfläche übersetzt.</p></div></div><div class="memory-strip">${data.strip.map(item=>`<article class="photo-card"><img src="${item.img}" alt="Persönliches Motiv als Kartenbild" width="804" height="1428" loading="lazy"><div class="photo-caption"><strong>${item.title}</strong><span>${item.text}</span></div></article>`).join('')}</div></section><section class="shelf"><div class="section-head"><div><p class="section-label">Neue Stimmung</p><p class="section-note">Das Bild bringt jetzt echte Richtung hinein.</p></div></div><article class="paper-card"><h3>Persönlicher statt abstrakt</h3><div class="paper-rule"></div><p>Der Look lehnt sich an Hauttöne, dunkles Haar, kühles Metall und warmes Rot an, statt nur auf generische Dark-UI-Flächen zu setzen.</p><div class="tag-row"><span class="tag">portraitnah</span><span class="tag">rosenholz</span><span class="tag">silber</span><span class="tag">weich</span></div></article><div class="stats-grid">${data.stats.map(s=>`<article class="slim-card"><p class="stat-label">${s.title}</p><p class="stat-value">${s.value}</p></article>`).join('')}</div></section></section>`}
    function timeline(){return `<section class="screen-stack"><header><p class="section-label">Bildkartei</p><h2 class="screen-title">Persönliche Einträge</h2><p class="muted">Noch mit einem Bild aufgebaut, aber schon klar fotozentrierter.</p></header><div class="tab-rail"><button class="tab-pill is-active">Portrait</button><button class="tab-pill">Momente</button><button class="tab-pill">Rudel</button></div><div class="catalog-list">${data.timeline.map(item=>`<article class="memory-card"><div class="memory-top"><span class="chip">${item.type}</span><span class="muted">${item.time}</span></div><div class="memory-preview"><img src="${item.img}" alt="Eintrag mit persönlichem Foto" width="804" height="1428" loading="lazy"></div><h3>${item.title}</h3><p class="card-copy">${item.copy}</p></article>`).join('')}</div></section>`}
    function placeholder(label,title,text){return `<section class="screen-stack"><header><p class="section-label">${label}</p><h2 class="screen-title">${title}</h2><p class="muted">${text}</p></header><article class="paper-card"><h3>${title}</h3><div class="paper-rule"></div><p>${text}</p><div class="button-row"><button class="btn btn-primary" data-route-jump="timeline">Zur Bildkartei</button></div></article></section>`}
    function render(){const views={home:home(),timeline:timeline(),post:placeholder('Postfach','Post','Hier könnten später persönliche Nachrichten und gespeicherte Texte wohnen.'),dog:placeholder('Pfote','Pfotenbereich','Mit den Hundebildern kann dieser Bereich später sehr schön lebendig werden.'),more:placeholder('Mehr','Mehr Bilder','Sobald die anderen Fotos eingebaut sind, bekommt die App echte Album-Qualität.')};app.innerHTML=views[state.route]||views.home;nav.forEach(item=>{const active=item.dataset.route===state.route;item.classList.toggle('is-active',active);if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current')});bind()}
    nav.forEach(item=>item.addEventListener('click',()=>{state.route=item.dataset.route;render();window.scrollTo({top:0,behavior:'smooth'})}));render();
  </script>
</body>
</html>
